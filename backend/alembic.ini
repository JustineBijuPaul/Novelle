# Novelle — Alembic Configuration
# ====================================
# Run migrations from the backend/ directory:
#   cd backend
#   source venv/bin/activate
#   alembic upgrade head
#
# Install Alembic first (add to requirements.txt too):
#   pip install alembic

[alembic]
# Path to migration scripts
script_location = alembic

# Template for new migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# SQLAlchemy URL — reads from .env via env.py (do not put secrets here)
# sqlalchemy.url is set dynamically in alembic/env.py

# Max length of slug in file names
truncate_slug_length = 40

# Set to 'true' to run the environment during setup phase
prepend_sys_path = .

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
